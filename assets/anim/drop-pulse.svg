<svg xmlns="http://www.w3.org/2000/svg" width="64" height="84" viewBox="0 0 64 84" role="img" aria-label="Goutte d'encre vermillon qui pulse">
  <title>goutte d'encre — playground</title>
  <style>
    .drop { transform-origin: 32px 52px; }
    .halo { transform-origin: 32px 52px; opacity: 0.28; }
    .drop { animation: beat 1.8s ease-in-out infinite alternate; }
    .halo { animation: halo 1.8s ease-in-out infinite alternate; }
    @keyframes beat {
      from { transform: scale(1); }
      to   { transform: scale(1.1); }
    }
    @keyframes halo {
      from { transform: scale(1);    opacity: 0.28; }
      to   { transform: scale(1.35); opacity: 0.08; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <path class="halo" d="M32,6 C32,6 10,34 10,53 C10,67.3 19.6,77 32,77 C44.4,77 54,67.3 54,53 C54,34 32,6 32,6 Z" fill="#e16c37"/>
  <path class="drop" d="M32,10 C32,10 14,35 14,52 C14,64.1 22,72 32,72 C42,72 50,64.1 50,52 C50,35 32,10 32,10 Z" fill="#e16c37"/>
  <ellipse cx="32" cy="58" rx="9" ry="7" fill="#f4a460" opacity="0.45"/>
</svg>
