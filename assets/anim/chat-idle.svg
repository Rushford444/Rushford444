    <path d="M147,104 C163,92 237,92 253,104 L253,120 C237,108 163,108 147,120 Z" fill="#e16c37"/>
    <path d="M250,110 C280,106 298,116 306,136 C292,128 276,127 264,132 C260,124 256,116 250,110 Z" fill="#e16c37"/>
    <path d="M250,116 C272,118 286,128 292,144 C282,138 270,135 260,136 Z" fill="#e16c37" opacity="0.9"/>
    <g fill="none" stroke="#29201e" stroke-width="5" stroke-linecap="round">
      <path d="M167,134 q9,8 21,0"/>
      <path d="M212,134 q9,8 21,0"/>
