<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 400 400" role="img" aria-label="Chat samurai sumi-e — idle">
  <title>neko samurai — idle (héros du jeu à venir)</title>
  <style>
    .f2 { opacity: 0; }
    .f1 { animation: fa 0.6s steps(1, end) infinite; }
    .f2 { animation: fb 0.6s steps(1, end) infinite; }
    @keyframes fa { 0% {opacity:1} 50% {opacity:0} 100% {opacity:0} }
    @keyframes fb { 0% {opacity:0} 50% {opacity:1} 100% {opacity:1} }
    .shadow {
      animation: sh 1.8s ease-in-out infinite alternate;
      transform-origin: 200px 336px;
    }
    @keyframes sh {
      from { transform: scaleX(1);    opacity: 0.55; }
      to   { transform: scaleX(1.12); opacity: 0.32; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x="1" y="1" width="398" height="398" rx="5" fill="#29201e" stroke="#e16c37" stroke-width="1"/>

  <!-- ombre qui pulse -->
  <ellipse class="shadow" cx="200" cy="336" rx="92" ry="15" fill="#120d0c" opacity="0.55"/>

  <!-- brins d'herbe sumi-e -->
  <g fill="none" stroke="#8a7a70" stroke-linecap="round">
    <path d="M96,334 C92,320 94,308 101,299" stroke-width="3"/>
    <path d="M104,334 C103,324 105,316 110,309" stroke-width="2"/>
    <path d="M304,334 C308,320 306,308 299,299" stroke-width="3"/>
    <path d="M296,334 C297,324 295,316 290,309" stroke-width="2"/>
  </g>

