    <path d="M195,148 L205,148 L200,155 Z" fill="#29201e"/>
    <path d="M196,161 q4,4 8,0" fill="none" stroke="#29201e" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="none" stroke="#cbb7a4" stroke-width="2" stroke-linecap="round">
      <path d="M160,144 C150,142 141,142 133,145"/>
      <path d="M160,152 C151,153 142,155 135,159"/>
      <path d="M240,144 C250,142 259,142 267,145"/>
      <path d="M240,152 C249,153 258,155 265,159"/>
