    <path d="M262,308 C298,304 316,280 306,258 C300,246 286,244 280,252" fill="none" stroke="#f4e8dd" stroke-width="13" stroke-linecap="round"/>
    <path d="M149,92 C139,66 143,47 156,37 C167,46 175,62 177,78 C167,82 156,86 149,92 Z" fill="#f4e8dd"/>
    <path d="M251,92 C261,66 257,47 244,37 C233,46 225,62 223,78 C233,82 244,86 251,92 Z" fill="#f4e8dd"/>
